<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DoodleStudy Prototype</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <!-- Researcher Controls -->
  <div id="ui">
    <div id="controls">
      <button id="start-btn">Start Study</button>
      <button id="toggle-btn">Toggle Condition (C)</button>
      <button id="reset-btn">Reset (R)</button>
    </div>

    <div id="colour-picker" style="display:none;">
      <span>Brush Colour:</span>
      <div id="swatches">
        <button class="swatch" data-colour="#ff0000" style="background:#ff0000;"></button>
        <button class="swatch" data-colour="#0000ff" style="background:#0000ff;"></button>
        <button class="swatch" data-colour="#00aa00" style="background:#00aa00;"></button>
        <button class="swatch" data-colour="#ffcc00" style="background:#ffcc00;"></button>
        <button class="swatch" data-colour="#000000" style="background:#000000;"></button>
      </div>
      <input type="color" id="brush-colour" value="#ff0000">
    </div>

    <div id="status" style="color:red; font-weight:bold;"></div>
  </div>

  <!-- Canvas and Reference Image Area -->
  <div id="app-container">
    <div id="canvas-holder"></div>
    
    <div id="reference-panel">
      <h3 id="task-title">Task: Sketch the image</h3>
      <p id="image-counter">A random image will appear here.</p>
      
      <div id="image-container">
        <p style="color:#aaa;">Waiting to start...</p>
      </div>
    </div>
  </div>

  <script src="logger.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
